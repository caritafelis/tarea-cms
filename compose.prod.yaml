name: stuvgraph

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  image: ${APP_IMAGE:?define APP_IMAGE}:${IMAGE_TAG:?define IMAGE_TAG}
  env_file: .env
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging: *logging
  tmpfs:
    - /tmp:size=128m,uid=82,gid=82
    - /var/www/html/storage/framework:size=256m,uid=82,gid=82
    - /var/www/html/storage/logs:size=64m,uid=82,gid=82
    - /var/www/html/bootstrap/cache:size=32m,uid=82,gid=82
  volumes:
    - app-storage:/var/www/html/storage/app
  depends_on:
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?define APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?define ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  web:
    image: ${WEB_IMAGE:?define WEB_IMAGE}:${IMAGE_TAG:?define IMAGE_TAG}
    restart: unless-stopped
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - app-storage:/var/www/html/storage/app:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    <<: *app
    command: ["php-fpm"]
    mem_limit: ${APP_MEM_LIMIT:-768m}
    cpus: ${APP_CPUS:-1.5}
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--backoff=10", "--max-time=3600", "--memory=192", "--timeout=90"]
    mem_limit: ${WORKER_MEM_LIMIT:-384m}
    cpus: ${WORKER_CPUS:-1}
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Redis local para cache/sesion/colas. Con ElastiCache: quita este servicio y el depends_on de redis.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?define REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru"]
    volumes: [redis-data:/data]
    mem_limit: 320m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app-storage:
  redis-data:
  caddy-data:
  caddy-config:
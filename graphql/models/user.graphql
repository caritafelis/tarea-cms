type User {
    id: ID!
    name: String!
    email: String!
    email_verified_at: DateTime
    addresses: [Address!]! @hasMany
    orders: [Order!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

type Address {
    id: ID!
    first_name: String!
    last_name: String!
    company_name: String
    street_address: String!
    street_address_plus: String
    postal_code: String!
    city: String!
    state: String
    phone_number: String
    shipping_default: Boolean!
    billing_default: Boolean!
    type: String
    country: Country! @belongsTo
    user: User! @belongsTo
}

[www]
; el contenedor corre como www-data (sin root): no se define user/group
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
pm.max_requests = 500
pm.process_idle_timeout = 20s
request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
ping.path = /ping
ping.response = pong
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
php_admin_value[memory_limit] = 256M
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,pcntl_exec,show_source
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { 
    worker_connections 1024;
    }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    client_max_body_size 64m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # IP real del cliente (Caddy / ALB / Cloudflare estan en rangos privados del VPC/docker)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/vnd.api+json application/xml image/svg+xml;

    # Anti-abuso: no satura PHP-FPM
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=gql:10m  rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_x_forwarded_proto $https_flag {
        default off; https on; 
    }

    upstream php_fpm {
        server app:9000;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        limit_conn perip 40;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /nginx-health { 
            access_log off; default_type text/plain; return 200 "ok"; 
        }

        # nunca servir dotfiles ni artefactos sensibles
        location ~ /\.(?!well-known) { 
            deny all; 
        }
        location ~* \.(env|git|bak|sql|sqlite|ini|log|yml|yaml|lock|dist|sh)$ {
             deny all; 
        }

        location ^~ /build/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Archivos generados por la app (sitemap, robots, medios locales)
        location ^~ /storage/ {
            expires 7d;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Webhooks de pasarelas: sin rate limit
        location ^~ /api/payments/webhook { 
            try_files $uri /index.php?$query_string; 
        }
        location ^~ /api/webhooks/        { 
            try_files $uri /index.php?$query_string; 
        }

        location = /graphql {
            limit_req zone=gql burst=20 nodelay;
            client_max_body_size 2m;
            try_files $uri /index.php?$query_string;
        }

        location ^~ /api/tokens {
            limit_req zone=auth burst=5 nodelay;
            try_files $uri /index.php?$query_string;
        }

        location ^~ /api/ {
            limit_req zone=api burst=40 nodelay;
            try_files $uri /index.php?$query_string;
        }

        location ~ ^/(login|register|forgot-password|reset-password|two-factor-challenge)$ {
            limit_req zone=auth burst=5 nodelay;
            try_files $uri /index.php?$query_string;
        }

        location / { 
            try_files $uri $uri/ /index.php?$query_string; 
        }

        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php_fpm;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $https_flag;
            fastcgi_read_timeout 70s;
            fastcgi_send_timeout 70s;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
            internal;
        }

        location ~ \.php$ { 
            return 404; 
        }
    }
}